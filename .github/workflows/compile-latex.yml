name: Compile and Release PDF
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Důležité pro nahrávání do Releases
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' # Spustí se jen při pushi do hlavní větve
        with:
          tag_name: latest
          name: "Nejnovější verze kuchařky"
          body: "Toto PDF je automaticky generováno při každém uložení (push) do větve main."
          files: build/main.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
